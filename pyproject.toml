[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "github-member-activity-agent"
version = "0.8.1"
description = "Read-only GitHub member activity agent with a MongoDB-first cache"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "github-copilot-sdk>=1.0.16,<2",
  "httpx>=0.27,<1",
  "keyring>=25.6,<26",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.6,<3",
  "pymongo>=4.10,<5",
  "rich>=14,<16",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pyinstaller>=6.11,<7",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-openpyxl>=3.1,<4",
]

[project.scripts]
github-member-activity = "github_team_stats.presentation.cli:main"
github-member-lines = "github_team_stats.presentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/github_team_stats"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
source = ["github_team_stats"]
omit = [
  "*/__main__.py",
  "*/app.py",
  "*/bootstrap.py",
  "*/cli.py",
  "*/copilot_runtime.py",
  "*/agent/runtime.py",
  "*/presentation/cli.py",
  "*/presentation/terminal.py",
  "*/presentation/web/server.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "work", "outputs"]
